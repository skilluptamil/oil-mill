<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 60" width="290" height="60">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#BF8212"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#446A2F"/>
      <stop offset="100%" stop-color="#243C16"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
    .brand-title { font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 800; letter-spacing: 0.5px; }
    .brand-sub { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.8px; font-weight: 800; letter-spacing: 2.2px; }
  </style>
  <!-- Icon: Traditional Wooden Chekku Pestle & Oil Drop with Leaves -->
  <g transform="translate(2, 6)">
    <!-- Base mortar representation -->
    <path d="M6 36 C6 44 14 48 24 48 C34 48 42 44 42 36 L40 28 L8 28 Z" fill="url(#greenGrad)" />
    <!-- Golden oil drop inside/above -->
    <path d="M24 6 C24 6 36 22 36 28 C36 34.6 30.6 40 24 40 C17.4 40 12 34.6 12 28 C12 22 24 6 24 6 Z" fill="url(#goldGrad)" opacity="0.95" />
    <circle cx="21" cy="24" r="3.2" fill="#FFF" opacity="0.65"/>
    <!-- Organic leaf sprig -->
    <path d="M24 10 C30 10 38 4 44 4 C44 12 36 18 28 17" fill="none" stroke="#689F38" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M24 16 C18 14 12 6 8 8 C8 15 16 19 22 18" fill="none" stroke="#689F38" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <!-- Brand Typography: Bold, high contrast, perfect proportions -->
  <text x="56" y="30" class="brand-title" xml:space="preserve"><tspan fill="#243F16">VAAGAI</tspan><tspan dx="8" fill="#C2871A" font-weight="700">CHEKKU</tspan></text>
  <text x="57" y="47" class="brand-sub" fill="#364535">COLD-PRESSED OIL MILL</text>
</svg>